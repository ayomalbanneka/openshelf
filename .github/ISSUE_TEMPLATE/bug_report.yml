name: "🐛 Bug Report"
description: Report a bug or unexpected behaviour in OpenShelf
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        Please provide enough detail so we can reproduce and fix this quickly.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Frontend (Next.js)
        - Backend (Express / Prisma)
        - Database (PostgreSQL)
        - Storage (MinIO / Cloudflare R2)
        - Auth
        - DevOps / CI/CD
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "🔴 Critical – app crash / data loss"
        - "🟠 High – major feature broken"
        - "🟡 Medium – feature partially broken"
        - "🟢 Low – minor / cosmetic"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Node version:
        - Browser (if frontend):
        - Docker Compose version:

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste any error output or attach screenshots.
      render: shell
name: ✅ PR Quality Checks

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  # ── Ensure PRs target develop (not main) unless hotfix ────────────────────
  check-base-branch:
    name: Check Base Branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject PRs targeting main from non-hotfix branches
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;
            const isHotfix = head.startsWith('hotfix/');

            if (base === 'main' && !isHotfix) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `⚠️ **Wrong base branch!**\n\nThis PR targets \`main\` but the head branch \`${head}\` doesn't look like a hotfix.\n\nPlease retarget to \`develop\`, or rename your branch to \`hotfix/<name>\` if this is truly a hotfix.`,
              });
              core.setFailed('PRs should target `develop`, not `main`, unless they are hotfixes.');
            }

  # ── Validate PR title format ──────────────────────────────────────────────
  check-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check title follows convention
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            // Conventional-commit style: type(scope): description
            const pattern = /^(feat|fix|chore|docs|refactor|test|ci|style|perf|build|revert)(\(.+\))?: .{5,}/;
            if (!pattern.test(title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `⚠️ **PR title doesn't follow the convention.**\n\nExpected format:\n\`\`\`\nfeat(auth): add OAuth login support\nfix(storage): resolve R2 presigned URL expiry bug\nchore(deps): update Prisma to v7.1\n\`\`\`\n\nValid types: \`feat\`, \`fix\`, \`chore\`, \`docs\`, \`refactor\`, \`test\`, \`ci\`, \`style\`, \`perf\`, \`build\`, \`revert\``,
              });
              core.setFailed('PR title must follow Conventional Commits format.');
            }

  # ── Ensure PR has a linked issue ─────────────────────────────────────────
  check-linked-issue:
    name: Check Linked Issue
    runs-on: ubuntu-latest
    steps:
      - name: Warn if no issue is linked
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const hasLink = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#\d+/i.test(body);
            if (!hasLink) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `💡 **Tip:** No linked issue detected in the PR description.\n\nAdd a closing keyword to auto-close the related issue when this PR merges:\n\`\`\`\nCloses #42\n\`\`\``,
              });
              // Warning only – not a hard failure
            }
name: 🔀 Branch & Release Automation

on:
  pull_request:
    types: [closed]
  push:
    branches:
      - main

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  # ── When a PR merges into develop, comment on linked issues ──────────────
  notify-linked-issues:
    name: Notify Linked Issues on PR Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    steps:
      - name: Comment on linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const base = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;

            // Extract all linked issue numbers
            const matches = [...body.matchAll(/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#(\d+)/gi)];
            for (const match of matches) {
              const issueNumber = parseInt(match[3], 10);
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `✅ PR #${prNumber} has been merged into \`${base}\`.\n\n${base === 'main' ? '🚀 This fix/feature is now in **production**.' : '🧪 This will be available in the next release when `develop` is merged to `main`.'}\n\n[View PR](${prUrl})`,
                });
              } catch (e) {
                console.log(`Could not comment on issue #${issueNumber}: ${e.message}`);
              }
            }

  # ── Auto-delete merged feature/fix branches ───────────────────────────────
  delete-merged-branch:
    name: Delete Merged Branch
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'main') &&
      !startsWith(github.event.pull_request.head.ref, 'develop')
    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch: ${branch}`);
            } catch (e) {
              console.log(`Could not delete branch ${branch}: ${e.message}`);
            }
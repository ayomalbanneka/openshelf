name: 🏷️ Auto Label & Triage

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ── Label issues based on their template prefix in the title ─────────────
  label-issue:
    name: Label Issue by Title Prefix
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Label by title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const labelMap = {
              '[FEAT]':    ['feature'],
              '[BUG]':     ['bug'],
              '[DEVOPS]':  ['devops', 'infrastructure'],
              '[REFACTOR]':['refactor', 'tech-debt'],
              '[DOCS]':    ['documentation'],
            };
            for (const [prefix, labels] of Object.entries(labelMap)) {
              if (title.toUpperCase().startsWith(prefix)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels,
                });
                break;
              }
            }

  # ── Label PRs targeting main as hotfix ────────────────────────────────────
  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Label PR targeting main
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            if (base === 'main') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['hotfix'],
              });
            }
            if (base === 'develop') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['pull-request'],
              });
            }
name: 📋 Project Board Automation

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, review_requested, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  repository-projects: write
  contents: read

jobs:
  # ── Move issues on the project board based on their state ─────────────────
  sync-issue-to-board:
    name: Sync Issue State → Board
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Add newly opened issue to board (Backlog)
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENSHELF }}
          script: |
            // GraphQL: add item to project and set status to "Backlog"
            // Replace PROJECT_NUMBER with your actual GitHub Project number
            const projectNumber = parseInt('${{ vars.PROJECT_NUMBER }}', 10);
            if (!projectNumber) { console.log('PROJECT_NUMBER not set, skipping'); return; }

            const { data: project } = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) { id }
                }
              }`, { owner: context.repo.owner, number: projectNumber }
            ).catch(() => github.graphql(`
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) { id }
                }
              }`, { owner: context.repo.owner, number: projectNumber }
            ));

            const projectId = project?.user?.projectV2?.id || project?.organization?.projectV2?.id;
            if (!projectId) { console.log('Project not found'); return; }

            await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`, {
                projectId,
                contentId: context.payload.issue.node_id,
              }
            );
            console.log(`Issue #${context.issue.number} added to project board.`);

  # ── Add new PRs to the board ────────────────────────────────────────────────
  sync-pr-to-board:
    name: Sync PR → Board
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Add PR to project board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENSHELF }}
          script: |
            const projectNumber = parseInt('${{ vars.PROJECT_NUMBER }}', 10);
            if (!projectNumber) { console.log('PROJECT_NUMBER not set, skipping'); return; }

            const query = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) { projectV2(number: $number) { id } }
              }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner, number: projectNumber
            }).catch(() => github.graphql(query.replace('user', 'organization'), {
              owner: context.repo.owner, number: projectNumber
            }));

            const projectId = result?.user?.projectV2?.id || result?.organization?.projectV2?.id;
            if (!projectId) return;

            await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`, {
                projectId,
                contentId: context.payload.pull_request.node_id,
              }
            );